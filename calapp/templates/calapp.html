
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #080d1b, #101d35, #07111f);
            color: #ffffff;
        }

        form {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: #111c30;
            border: 1px solid #263956;
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        h1::after {
            content: "";
            display: block;
            width: 55px;
            height: 4px;
            margin: 12px auto 28px;
            border-radius: 10px;
            background: #38bdf8;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            display: block;
            width: 100%;
            height: 48px;
            padding: 0 14px;
            margin-bottom: 22px;
            border: 1px solid #334863;
            border-radius: 10px;
            outline: none;
            background: #0a1324;
            color: #ffffff;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        
/* Two buttons in each row */
button {
    width: calc(50% - 7px);
    padding: 13px 8px;
    margin-bottom: 12px;
    border: 1px solid #334863;
    border-radius: 10px;
    background: #1b2b43;
    color: #e2e8f0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    display: inline-block;
    vertical-align: top;
}

button:hover {
    background: #263e5c;
    border-color: #38bdf8;
    color: #38bdf8;
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

button[value="add"] {
    background: #0284c7;
    border-color: #0284c7;
    color: #ffffff;
}

button[value="add"]:hover {
    background: #0369a1;
    color: #ffffff;
}


        label:last-of-type {
            margin-top: 15px;
        }

        input[readonly] {
            margin-bottom: 0;
            border: 1px solid #0e7490;
            background: #082b3b;
            color: #67e8f9;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        @media (max-width: 480px) {
            form {
                padding: 25px 20px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <form action="/calculatorapp/calculate/" method="GET">
        <h1>Calculator</h1>

        <label>First Num:</label>
        <input type="number" name="num1" value="{{num1}}" required>

        <br><br>

        <label>Second Num:</label>
        <input type="number" name="num2" value="{{num2}}" required>

        <br><br>

        <button type="submit" name="operation" value="add">
            Addition
        </button>

        <button type="submit" name="operation" value="sub">
            Subtraction
        </button>

        <button type="submit" name="operation" value="mul">
            Multiplication
        </button>

        <button type="submit" name="operation" value="div">
            Division
        </button>

        <br><br>

        <label>Result:</label>
        <input type="number" value="{{ result }}" readonly>
    </form>
</body>
</html>
